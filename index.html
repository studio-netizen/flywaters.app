    <!-- Move Iubenda floating privacy button above the bottom nav on mobile -->
    <script>
      (function () {
        function moveIubenda() {
          if (window.innerWidth <= 768) {
            document.querySelectorAll('.iubenda-tp-btn').forEach(function (btn) {
              btn.style.cssText = 'bottom: 80px !important; z-index: 40 !important;';
            });
          }
        }
        window.addEventListener('load', moveIubenda);
        window.addEventListener('resize', moveIubenda);
        setTimeout(moveIubenda, 2000);
        setTimeout(moveIubenda, 4000);
      })();
    </script>
